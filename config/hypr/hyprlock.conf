background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 8
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgb(255, 255, 255)
    font_size = 80
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = rgb(200, 200, 200)
    font_size = 20
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    outer_color = rgb(100, 100, 100)
    inner_color = rgb(20, 20, 20)
    font_color = rgb(255, 255, 255)
    position = 0, -100
    halign = center
    valign = center
}
