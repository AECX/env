# ─────────────────────────────────────────────
# Sleek Dark Hyprlock
# ─────────────────────────────────────────────

# Background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.15
}

# ─────────────────────────────────────────────
# Clock
# ─────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(eeeeeeff)
    font_size = 96
    font_family = Inter
    position = 0, 130
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(aaaaaaff)
    font_size = 18
    font_family = Inter
    position = 0, 55
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# User
# ─────────────────────────────────────────────

label {
    monitor =
    text = $USER
    color = rgba(eeeeeeff)
    font_size = 18
    font_family = Inter
    position = 0, -120
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# Password box
# ─────────────────────────────────────────────

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2

    inner_color = rgba(202020cc)
    outer_color = rgba(555555cc)
    font_color = rgba(eeeeeeff)

    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Enter password...</span>

    position = 0, -190
    halign = center
    valign = center

    rounding = 14
    shadow_passes = 3
    shadow_size = 8
}

# ─────────────────────────────────────────────
# Failed authentication message
# ─────────────────────────────────────────────

label {
    monitor =
    text = $FAIL
    color = rgba(ff6666ff)
    font_size = 14
    font_family = Inter

    position = 0, -255
    halign = center
    valign = center
}

