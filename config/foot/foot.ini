shell=fish
title=foot
font=GeistMono Nerdfont Mono:size=14
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=yes
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=block

[colors-dark]
alpha=0.78
alpha-mode=matching
blur=yes

[key-bindings]
unicode-input=Control+Shift+Alt+u
scrollback-up-page=Control+Shift+u
scrollback-down-page=Control+Shift+d
scrollback-up-line=Control+Shift+k
scrollback-down-line=Control+Shift+j
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
